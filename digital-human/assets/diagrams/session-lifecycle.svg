<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" font-family="'Noto Sans SC','PingFang SC',sans-serif">
<defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#71839A"/></marker></defs>
<rect width="1200" height="330" fill="#FFFFFF"/>
<text x="60" y="44" font-family="ui-monospace,monospace" font-size="11" letter-spacing="2" fill="#0B9E88">FIGURE 3</text>
<text x="60" y="74" font-size="19" font-weight="700" fill="#13263B">数字人会话的生命周期</text>
<text x="60" y="98" font-size="12" fill="#71839A">从点开“数字人”到释放显存，一共六个状态；每一步都有可观测的指标。</text>

<g font-size="12.5">
<rect x="60" y="140" width="150" height="64" rx="12" fill="#F7FAF9" stroke="#E3ECE9"/><text x="135" y="170" text-anchor="middle" fill="#13263B" font-weight="700">待命</text><text x="135" y="190" text-anchor="middle" font-size="10.5" fill="#71839A">课堂已打开</text>
<rect x="250" y="140" width="150" height="64" rx="12" fill="#F7FAF9" stroke="#E3ECE9"/><text x="325" y="170" text-anchor="middle" fill="#13263B" font-weight="700">建会话</text><text x="325" y="190" text-anchor="middle" font-size="10.5" fill="#71839A">offer / answer</text>
<rect x="440" y="140" width="150" height="64" rx="12" fill="#F7FAF9" stroke="#E3ECE9"/><text x="515" y="170" text-anchor="middle" fill="#13263B" font-weight="700">连接中</text><text x="515" y="190" text-anchor="middle" font-size="10.5" fill="#71839A">候选重写 · ICE</text>
<rect x="630" y="140" width="150" height="64" rx="12" fill="#E3F5F0" stroke="#9FD8C9"/><text x="705" y="170" text-anchor="middle" fill="#087A6A" font-weight="700">就绪</text><text x="705" y="190" text-anchor="middle" font-size="10.5" fill="#087A6A">首帧 2.4s</text>
<rect x="820" y="140" width="150" height="64" rx="12" fill="#E3F5F0" stroke="#9FD8C9"/><text x="895" y="170" text-anchor="middle" fill="#087A6A" font-weight="700">播报</text><text x="895" y="190" text-anchor="middle" font-size="10.5" fill="#087A6A">字幕随音频推进</text>
<rect x="1010" y="140" width="130" height="64" rx="12" fill="#FDF3E8" stroke="#F0CFA9"/><text x="1075" y="170" text-anchor="middle" fill="#B0702E" font-weight="700">回收</text><text x="1075" y="190" text-anchor="middle" font-size="10.5" fill="#B0702E">关闭/超时</text>
</g>
<g stroke="#71839A" stroke-width="1.2" marker-end="url(#a3)">
<line x1="212" y1="172" x2="244" y2="172"/><line x1="402" y1="172" x2="434" y2="172"/><line x1="592" y1="172" x2="624" y2="172"/><line x1="782" y1="172" x2="814" y2="172"/><line x1="972" y1="172" x2="1004" y2="172"/>
</g>
<path d="M895 206 C895 250 705 250 705 208" fill="none" stroke="#E08A3C" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a3)"/>
<text x="800" y="268" text-anchor="middle" font-size="11" fill="#B0702E">暂停 / 提问打断：保留位置，不重播</text>
<text x="60" y="306" font-size="11" fill="#71839A">同一会话内切换文字模式与数字人模式，讲稿与页码不变；回收后再次进入会重新建会话。</text>
</svg>