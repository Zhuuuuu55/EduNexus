<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" font-family="'Noto Sans SC','PingFang SC',sans-serif">
<defs><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0B9E88"/></marker></defs>
<rect width="1200" height="500" fill="#FFFFFF"/>
<text x="60" y="44" font-family="ui-monospace,monospace" font-size="11" letter-spacing="2" fill="#0B9E88">FIGURE 4</text>
<text x="60" y="74" font-size="19" font-weight="700" fill="#13263B">一套能力，两种课堂：模拟课堂与算法实验室</text>
<text x="60" y="98" font-size="12" fill="#71839A">数字人、语音、字幕、打断是共享层；差异只在“内容源”——课件页 vs 推演步骤。</text>

<rect x="60" y="150" width="250" height="200" rx="16" fill="#F7FAF9" stroke="#E3ECE9"/>
<text x="80" y="182" font-family="ui-monospace,monospace" font-size="10" letter-spacing="1.4" fill="#71839A">SCENARIO A</text>
<text x="80" y="210" font-size="16" font-weight="700" fill="#13263B">模拟课堂</text>
<text x="80" y="238" font-size="11.5" fill="#44586C">课件页 · 逐页讲解</text>
<text x="80" y="258" font-size="11.5" fill="#44586C">讲稿生成 · 公式口播</text>
<text x="80" y="278" font-size="11.5" fill="#44586C">翻页 · 暂停 · 提问</text>
<text x="80" y="298" font-size="11.5" fill="#44586C">课堂字幕 · 笔记 · Demo</text>

<rect x="475" y="150" width="250" height="200" rx="16" fill="#E3F5F0" stroke="#9FD8C9"/>
<text x="495" y="182" font-family="ui-monospace,monospace" font-size="10" letter-spacing="1.4" fill="#087A6A">SHARED LAYER</text>
<text x="495" y="210" font-size="16" font-weight="700" fill="#087A6A">数字人能力层</text>
<text x="495" y="238" font-size="11.5" fill="#087A6A">WebRTC 视频 720×1276</text>
<text x="495" y="258" font-size="11.5" fill="#087A6A">实时语音 · PCM 转发</text>
<text x="495" y="278" font-size="11.5" fill="#087A6A">字幕时间轴 · 打断恢复</text>
<text x="495" y="298" font-size="11.5" fill="#087A6A">会话回收 · 背压控制</text>

<rect x="890" y="150" width="250" height="200" rx="16" fill="#F7FAF9" stroke="#E3ECE9"/>
<text x="910" y="182" font-family="ui-monospace,monospace" font-size="10" letter-spacing="1.4" fill="#71839A">SCENARIO B</text>
<text x="910" y="210" font-size="16" font-weight="700" fill="#13263B">算法实验室</text>
<text x="910" y="238" font-size="11.5" fill="#44586C">题库 · 阶段 · 题目</text>
<text x="910" y="258" font-size="11.5" fill="#44586C">逐步推演 · 复杂度分析</text>
<text x="910" y="278" font-size="11.5" fill="#44586C">评测结果 · 追问</text>
<text x="910" y="298" font-size="11.5" fill="#44586C">讲解与推演同步</text>

<line x1="314" y1="250" x2="468" y2="250" stroke="#0B9E88" stroke-width="1.4" marker-end="url(#a4)"/>
<text x="391" y="240" text-anchor="middle" font-size="10.5" font-family="ui-monospace,monospace" fill="#087A6A">same pipeline</text>
<line x1="732" y1="250" x2="884" y2="250" stroke="#0B9E88" stroke-width="1.4" marker-end="url(#a4)"/>
<text x="808" y="240" text-anchor="middle" font-size="10.5" font-family="ui-monospace,monospace" fill="#087A6A">same pipeline</text>

<line x1="60" y1="382" x2="1140" y2="382" stroke="#E3ECE9"/>
<text x="60" y="412" font-size="12" font-weight="700" fill="#13263B">差异对照</text>
<text x="60" y="436" font-size="11.5" fill="#44586C">课堂：内容单位是“页”，讲解长度随页面文本；指标看首播耗时、逐页对齐。</text>
<text x="60" y="456" font-size="11.5" fill="#44586C">算法：内容单位是“步骤”，讲解跟随推演；指标看步骤切换、评测反馈延迟。</text>
<text x="1140" y="436" text-anchor="end" font-size="11" fill="#71839A">复用层级：视频通道 / 语音链路 / 字幕机制 / 打断与恢复</text>
</svg>