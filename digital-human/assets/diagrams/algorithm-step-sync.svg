<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 430" role="img" aria-label="教学同步，以当前执行步骤为锚点"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#087A6A"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif" fill="#13263B"><text x="40" y="43" font-size="24" font-weight="700">教学同步，以当前执行步骤为锚点</text><text x="40" y="72" font-size="14" fill="#44586C">以二分查找为例：一次比较与边界更新，共同驱动图示、代码高亮与语音讲解。</text><rect x="40" y="170" width="230" height="120" rx="12" fill="#F0FAF7" stroke="#A6CFC5"/><text x="155.0" y="203" text-anchor="middle" font-size="18" font-weight="600">当前步骤 k</text><text x="155.0" y="230" text-anchor="middle" font-size="13" fill="#44586C">数组 / 边界 / 中点</text><text x="155.0" y="252" text-anchor="middle" font-size="13" fill="#44586C">步骤标识 + 高亮行 + 讲稿</text><rect x="350" y="105" width="260" height="88" rx="12" fill="#F0FAF7" stroke="#A6CFC5"/><text x="480.0" y="138" text-anchor="middle" font-size="18" font-weight="600">交互图示</text><text x="480.0" y="165" text-anchor="middle" font-size="13" fill="#44586C">显示当前比较或交换状态</text><rect x="350" y="215" width="260" height="88" rx="12" fill="#F0FAF7" stroke="#A6CFC5"/><text x="480.0" y="248" text-anchor="middle" font-size="18" font-weight="600">同步代码</text><text x="480.0" y="275" text-anchor="middle" font-size="13" fill="#44586C">突出当前步骤对应的代码行</text><rect x="700" y="155" width="350" height="125" rx="12" fill="#F0FAF7" stroke="#A6CFC5"/><text x="875.0" y="188" text-anchor="middle" font-size="18" font-weight="600">数字人讲解</text><text x="875.0" y="215" text-anchor="middle" font-size="13" fill="#44586C">按当前步骤讲稿播报</text><text x="875.0" y="237" text-anchor="middle" font-size="13" fill="#44586C">暂停：保留当前未播音频</text><text x="875.0" y="259" text-anchor="middle" font-size="13" fill="#44586C">继续：续播当前响应</text><path d="M270 205H310V148H350" fill="none" stroke="#087A6A" stroke-width="1.6" marker-end="url(#arrow)"/><text x="0" y="0" font-size="12" fill="#087A6A"></text><path d="M270 240H310V259H350" fill="none" stroke="#087A6A" stroke-width="1.6" marker-end="url(#arrow)"/><text x="0" y="0" font-size="12" fill="#087A6A"></text><path d="M270 185H290V92H655V195H700" fill="none" stroke="#087A6A" stroke-width="1.6" marker-end="url(#arrow)"/><text x="432" y="88" font-size="12" fill="#087A6A">步骤讲稿</text><path d="M875 280V353H155V290" fill="none" stroke="#087A6A" stroke-width="1.6" marker-end="url(#arrow)"/><text x="380" y="343" font-size="12" fill="#087A6A">浏览器确认播完 → 实验室进入步骤 k+1</text><text x="40" y="404" font-size="14" fill="#44586C">代码提问：携带当前代码、行号与问题另起问答。停止或切换内容时，旧播报不会推动新步骤。</text></g></svg>