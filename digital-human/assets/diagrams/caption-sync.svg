<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" font-family="'Noto Sans SC','PingFang SC',sans-serif">
<rect width="1200" height="430" fill="#FFFFFF"/>
<text x="60" y="44" font-family="ui-monospace,monospace" font-size="11" letter-spacing="2" fill="#0B9E88">FIGURE 2</text>
<text x="60" y="76" font-size="19" font-weight="700" fill="#13263B">字幕为什么不能按字数估算</text>
<text x="60" y="100" font-size="12" fill="#71839A">同样是公式句，读成中文 5 秒、展开成口播 10.8 秒；按字数分时，误差会逐句累积。</text>

<text x="60" y="140" font-size="12.5" font-weight="700" fill="#44586C">按字数估算</text>
<text x="60" y="158" font-size="10.5" fill="#71839A">每 24 字 = 6 s</text>
<text x="60" y="250" font-size="12.5" font-weight="700" fill="#087A6A">按真实音频进度</text>
<text x="60" y="268" font-size="10.5" fill="#71839A">RTP 时间戳 → 播放位置</text>

<g fill="#EDF2F4" stroke="#C9D8DD">
<rect x="230" y="120" width="222" height="34" rx="5"/><rect x="456" y="120" width="222" height="34" rx="5"/><rect x="682" y="120" width="222" height="34" rx="5"/><rect x="908" y="120" width="212" height="34" rx="5"/>
</g>
<text x="341" y="142" text-anchor="middle" font-size="10.5" fill="#44586C">第一句 · 6.0s</text>
<text x="567" y="142" text-anchor="middle" font-size="10.5" fill="#44586C">公式句 · 6.0s</text>
<text x="793" y="142" text-anchor="middle" font-size="10.5" fill="#44586C">核函数 · 6.0s</text>
<text x="1014" y="142" text-anchor="middle" font-size="10.5" fill="#44586C">结论 · 6.0s</text>

<g fill="#DDF3EC" stroke="#9FD8C9">
<rect x="230" y="230" width="185" height="34" rx="5"/><rect x="419" y="230" width="400" height="34" rx="5"/><rect x="823" y="230" width="156" height="34" rx="5"/><rect x="983" y="230" width="137" height="34" rx="5"/>
</g>
<text x="322" y="252" text-anchor="middle" font-size="10.5" fill="#087A6A">第一句 · 5.0s</text>
<text x="619" y="252" text-anchor="middle" font-size="10.5" fill="#087A6A">公式句 · 10.8s（展开后更长）</text>
<text x="901" y="252" text-anchor="middle" font-size="10.5" fill="#087A6A">核函数 · 4.2s</text>
<text x="1051" y="252" text-anchor="middle" font-size="10.5" fill="#087A6A">结论 · 4.0s</text>

<line x1="908" y1="158" x2="983" y2="228" stroke="#E08A3C" stroke-width="1.2" stroke-dasharray="4 3"/>
<line x1="908" y1="120" x2="908" y2="270" stroke="#E08A3C" stroke-width="1" stroke-dasharray="2 3"/>
<text x="1120" y="300" text-anchor="end" font-size="11.5" fill="#B0702E">到第四句已累计漂移 ≈ 2.0s，越往后越对不上</text>

<line x1="230" y1="330" x2="1120" y2="330" stroke="#E3ECE9"/>
<g font-family="ui-monospace,monospace" font-size="10" fill="#71839A">
<text x="230" y="350">0s</text><text x="452" y="350">6s</text><text x="675" y="350">12s</text><text x="897" y="350">18s</text><text x="1112" y="350">24s</text>
</g>
<g font-family="ui-monospace,monospace" font-size="9" fill="#B9C6CE">
<line x1="452" y1="326" x2="452" y2="334"/><line x1="675" y1="326" x2="675" y2="334"/><line x1="897" y1="326" x2="897" y2="334"/>
</g>

<rect x="230" y="384" width="11" height="11" fill="#EDF2F4" stroke="#C9D8DD"/>
<text x="249" y="394" font-size="11" fill="#71839A">估算区间</text>
<rect x="340" y="384" width="11" height="11" fill="#DDF3EC" stroke="#9FD8C9"/>
<text x="359" y="394" font-size="11" fill="#71839A">实际播放区间</text>
<text x="1120" y="394" text-anchor="end" font-size="11" fill="#71839A">数据：acceptance/server-real-media.json（288 条进度事件）</text>
