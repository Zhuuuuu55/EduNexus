<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="'Noto Sans SC','PingFang SC',sans-serif">
<defs><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0B9E88"/></marker></defs>
<rect width="1200" height="400" fill="#FFFFFF"/>
<text x="60" y="44" font-family="ui-monospace,monospace" font-size="11" letter-spacing="2" fill="#0B9E88">FIGURE 5</text>
<text x="60" y="76" font-size="19" font-weight="700" fill="#13263B">推演步骤与讲解如何保持同一步</text>
<text x="60" y="100" font-size="12" fill="#71839A">算法实验室以“步骤”为内容单位：每推进一个步骤，讲解、字幕、高亮同时切换。</text>

<g font-size="12">
<rect x="60" y="140" width="200" height="56" rx="10" fill="#F7FAF9" stroke="#E3ECE9"/><text x="80" y="164" font-weight="700" fill="#13263B">① 读题</text><text x="80" y="182" font-size="10.5" fill="#71839A">输入 / 输出 / 约束</text>
<rect x="300" y="140" width="200" height="56" rx="10" fill="#F7FAF9" stroke="#E3ECE9"/><text x="320" y="164" font-weight="700" fill="#13263B">② 建模</text><text x="320" y="182" font-size="10.5" fill="#71839A">数据结构与不变量</text>
<rect x="540" y="140" width="200" height="56" rx="10" fill="#E3F5F0" stroke="#9FD8C9"/><text x="560" y="164" font-weight="700" fill="#087A6A">③ 推演</text><text x="560" y="182" font-size="10.5" fill="#087A6A">逐行状态变化</text>
<rect x="780" y="140" width="200" height="56" rx="10" fill="#F7FAF9" stroke="#E3ECE9"/><text x="800" y="164" font-weight="700" fill="#13263B">④ 复杂度</text><text x="800" y="182" font-size="10.5" fill="#71839A">时间 / 空间</text>
<rect x="1020" y="140" width="120" height="56" rx="10" fill="#FDF3E8" stroke="#F0CFA9"/><text x="1040" y="164" font-weight="700" fill="#B0702E">⑤ 追问</text><text x="1040" y="182" font-size="10.5" fill="#B0702E">学生提问</text>
</g>
<g stroke="#0B9E88" stroke-width="1.3" marker-end="url(#a5)">
<line x1="262" y1="168" x2="294" y2="168"/><line x1="502" y1="168" x2="534" y2="168"/><line x1="742" y1="168" x2="774" y2="168"/><line x1="982" y1="168" x2="1014" y2="168"/>
</g>

<line x1="60" y1="250" x2="1140" y2="250" stroke="#E3ECE9"/>
<g font-size="11.5" fill="#44586C">
<text x="60" y="282" font-weight="700" fill="#13263B">同一时刻</text>
<text x="160" y="282">讲解音频（PCM）</text>
<text x="160" y="302">字幕（RTP 进度）</text>
<text x="160" y="322">代码高亮 / 第几行</text>
</g>
<g font-size="11.5" fill="#087A6A">
<text x="620" y="282">→ 都以“当前步骤”为锚点</text>
<text x="620" y="302">→ 提问打断后从当前步骤继续</text>
<text x="620" y="322">→ 步骤切换不重播上一段</text>
</g>
<text x="60" y="372" font-size="11" fill="#71839A">与课堂的差别：课堂的锚点是“页”，算法实验室的锚点是“步骤”；同一套播放与字幕机制。</text>
</svg>