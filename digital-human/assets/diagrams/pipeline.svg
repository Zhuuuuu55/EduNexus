<text x="60" y="76" font-size="19" font-weight="700" fill="#13263B">数字人课堂：一次讲解的端到端链路</text>
<text x="60" y="100" font-size="12" fill="#71839A">视频走 WebRTC，语音走 PCM 转发，字幕由真实播放进度驱动。</text>

<path d="M1010 170 C1010 124 900 120 590 120 C280 120 170 124 170 170" fill="none" stroke="#0B9E88" stroke-width="1.4" marker-end="url(#arg)"/>
<text x="590" y="152" text-anchor="middle" font-size="12" fill="#087A6A">WebRTC：720×1276 视频 + 音频</text>

