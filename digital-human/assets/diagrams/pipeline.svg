<path d="M1010 350 C1010 396 900 402 590 402 C280 402 170 396 170 350" fill="none" stroke="#0B9E88" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arg)"/>
<rect x="404" y="390" width="372" height="24" fill="#FFFFFF"/>
<text x="590" y="407" text-anchor="middle" font-size="12" fill="#087A6A">真实音频进度（RTP 包）→ 字幕推进与校正</text>

<text x="60" y="452" font-size="11" fill="#71839A">注：三处服务必须指向同一实例；否则会出现 PCM 背压（429），表现为“声音在走、画面不动”。</text>
