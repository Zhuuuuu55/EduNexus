<marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0B9E88"/></marker>
</defs>
<rect width="1200" height="470" fill="#FFFFFF"/>
