appendCover();groups.forEach((g,i)=>{appendDemo(g,i);appendTech(g,i);});
groups.forEach((g,i)=>{const b=el('button','',g.name);b.type='button';b.onclick=()=>go(1+i*2);$('.chapter-nav').append(b);});
slides.forEach((s,i)=>{const b=el('button');b.type='button';b.setAttribute('aria-label','第 '+(i+1)+' 页：'+s.title);b.onclick=()=>go(i);$('.progress-dots').append(b);const row=el('button');row.type='button';row.append(el('span','',String(i+1).padStart(2,'0')),el('strong','',s.title),el('small','',s.type==='cover'?'目录':s.type==='demo'?'演示页':'技术页'));row.onclick=()=>{$('.outline-dialog').close();go(i);};$('.outline-list').append(row);});
function resize(){document.documentElement.style.setProperty('--scale',String(Math.min(innerWidth/1920,innerHeight/1080)));}window.addEventListener('resize',resize);resize();
function updateHash(){const s=slides[page],suffix=s.type==='demo'?'/'+s.group.demos[states[s.index].demo].id:'';try{history.replaceState(null,'','#'+(page+1)+suffix);}catch{}}
function go(index,fromHash=false,desiredDemo=null){
 index=Math.max(0,Math.min(slides.length-1,index));views.forEach(v=>v.remember?.());if($('.image-dialog').open)$('.image-dialog').close();page=index;
 views.forEach((v,i)=>v.section.hidden=i!==page);const s=slides[page];
 if(s.type==='demo'){const state=states[s.index];const di=desiredDemo?s.group.demos.findIndex(d=>d.id===desiredDemo):-1;if(di>=0)state.demo=di;views[page].selectDemo(state.demo,di>=0?0:state.media,false);}
 $$('.chapter-nav button').forEach((b,i)=>b.setAttribute('aria-current',String(s.index===i)));$$('.progress-dots button').forEach((b,i)=>b.setAttribute('aria-current',String(page===i)));$$('.outline-list button').forEach((b,i)=>b.setAttribute('aria-current',String(page===i)));
 $('.page-counter').textContent=String(page+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');$('.trail').textContent=s.type==='cover'?'模拟课堂 × 学习笔记 · 功能演示与技术设计':s.group.module+' / '+s.group.name+' / '+(s.type==='demo'?'功能演示':'技术设计');$('#previous').disabled=page===0;$('#next').disabled=page===slides.length-1;$('.announce').textContent='第 '+(page+1)+' 页，'+s.title;document.title=s.title+' | EduNexus 翻页演示';if(!fromHash)updateHash();
}
function readHash(){const m=location.hash.match(/^#(\d+)(?:\/([a-z0-9-]+))?/i);go(m?Number(m[1])-1:0,true,m?.[2]||null);}window.addEventListener('hashchange',readHash);
$('#previous').onclick=()=>go(page-1);$('#next').onclick=()=>go(page+1);
$('#open-outline').onclick=()=>{$('.outline-dialog').showModal();};
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{const button=$('#fullscreen');button.textContent='F11 全屏';button.title='当前预览不支持全屏接口，请在普通浏览器中按 F11。';}}
$('#fullscreen').onclick=fullscreen;document.addEventListener('fullscreenchange',()=>$('#fullscreen').textContent=document.fullscreenElement?'退出全屏 F':'全屏 F');
$$('.modal .close-dialog').forEach(b=>b.onclick=()=>b.closest('dialog').close());$$('.modal').forEach(d=>d.addEventListener('click',e=>{if(e.target!==d)return;const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}));
document.addEventListener('keydown',e=>{
 if(e.defaultPrevented||e.altKey||e.ctrlKey||e.metaKey||$('dialog[open]'))return;
 if(e.target.closest('video,input,textarea,select,[role=tab]'))return;
 if((e.key===' '||e.key==='Enter')&&e.target.closest('a,button'))return;
 if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(page+1);}else if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(page-1);}else if(e.key==='Home'){e.preventDefault();go(0);}else if(e.key==='End'){e.preventDefault();go(slides.length-1);}else if(/^[1-9]$/.test(e.key)){go(Number(e.key)-1);}else if(e.key.toLowerCase()==='g'){$('.outline-dialog').showModal();}else if(e.key.toLowerCase()==='f'){fullscreen();}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)views.forEach(v=>v.remember?.());});readHash();
})();
</script></body></html>
