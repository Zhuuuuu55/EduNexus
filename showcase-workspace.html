const examples={study:{q:'结合操作系统课件，解释什么是虚拟内存。',t:'虚拟内存：让程序看到更大的地址空间',p:['程序使用虚拟地址；操作系统通过页表把它映射到物理内存。暂时不在内存中的页面，可以在需要时调入。','结合课程资料定位概念、运行过程和易错点，回答可继续追问，并整理为学习笔记。'],s:'示例：课程课件 · 相关章节'},affairs:{q:'参加科研项目能认定多少课外学分？',t:'先核对培养方案与适用条件',p:['检索相关制度后，结合专业、年级、文件版本和具体事项解释适用条件。','实际分值与办理材料应以当前正式文件和负责部门确认为准；资料未覆盖的内容列为待核对事项。'],s:'示例：培养方案 · 学分认定'},ppt:{q:'为“虚拟内存”制作一份教学课件。',t:'先给出逐页教学方案',p:['第 1 页：学习目标；第 2—3 页：地址空间与页表；第 4 页：缺页处理；第 5 页：例题与总结。','确认方案后，再由课件工具生成可编辑 PPTX；预览条件具备时可逐页查看 PDF。'],s:'示例：逐页方案 · 等待确认'},code:{q:'帮我理解二分查找，并分析边界条件。',t:'从区间变化理解二分查找',p:['维护左右边界，每次比较中间元素，根据结果保留可能包含目标的一半区间。','导师结合代码给分层提示；公开样例用于观察过程，最终结果以实际评测为准。'],s:'示例：算法思路 · 评测分离'}};function select(mode){const x=examples[mode]||examples.study;document.querySelector('#question').textContent=x.q;document.querySelector('#title').textContent=x.t;document.querySelector('#copy').replaceChildren(...x.p.map(t=>{const p=document.createElement('p');p.textContent=t;return p}));document.querySelector('#source').textContent=x.s;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));document.querySelector('#feed').scrollTop=0}document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.mode)));const query=new URLSearchParams(location.search);if(query.has('compact'))document.querySelector('#app').classList.add('compact');select(query.get('mode')||'study');
