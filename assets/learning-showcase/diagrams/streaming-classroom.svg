</style><title>以当前页为中心的教学闭环</title><g><rect class="node tinted" x="20" y="40" width="280" height="125" rx="17"></rect><text x="42" y="70" class="node-label ">SCRIPT / 教学组织</text><text x="42" y="105" class="node-title ">预制 / 个人讲稿</text><text x="42" y="135" class="node-sub ">选择适合当前学习的讲法</text></g><g><rect class="node highlight" x="405" y="40" width="280" height="125" rx="17"></rect><text x="427" y="70" class="node-label light-text">CONTEXT / 共同依据</text><text x="427" y="105" class="node-title white-text">当前页与讲解位置</text><text x="427" y="135" class="node-sub light-text">页面 · 步骤 · 讲稿标识</text></g><g><rect class="node " x="790" y="40" width="280" height="125" rx="17"></rect><text x="812" y="70" class="node-label ">OUTPUT / 课堂表达</text><text x="812" y="105" class="node-title ">讲解与播放</text><text x="812" y="135" class="node-sub ">声音 · 文字 · 当前进度</text></g><path d="M305 103H397" class="edge "></path><path d="M690 103H782" class="edge "></path><g><rect class="node " x="20" y="300" width="280" height="125" rx="17"></rect><text x="42" y="330" class="node-label ">CONTROL / 学习节奏</text><text x="42" y="365" class="node-title ">手动与自动翻页</text><text x="42" y="395" class="node-sub ">目录定位 · 暂停 · 推进</text></g><g><rect class="node highlight" x="405" y="300" width="280" height="125" rx="17"></rect><text x="427" y="330" class="node-label light-text">RESUME / 保持连续</text><text x="427" y="365" class="node-title white-text">提问后的接续</text><text x="427" y="395" class="node-sub light-text">保存位置 → 回答 → 继续</text></g><g><rect class="node violet" x="790" y="300" width="280" height="125" rx="17"></rect><text x="812" y="330" class="node-label ">QUESTION / 互动</text><text x="812" y="365" class="node-title ">当前页的问题</text><text x="812" y="395" class="node-sub ">打断当前输出再回答</text></g><path d="M930 171V292" class="edge "></path><path d="M785 363H693" class="edge "></path><path d="M400 363H308" class="edge "></path><path d="M158 294V225H545V173" class="edge dashed"></path><text x="565" y="220" class="edge-label">更新上下文