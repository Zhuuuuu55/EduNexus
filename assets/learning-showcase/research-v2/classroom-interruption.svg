<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="提问不是新开一堂课：它是一段可返回的中断"><ns0:defs><ns0:marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><ns0:path d="M1 1L8 4.5L1 8" fill="none" stroke="#168E82" stroke-width="1.8" /></ns0:marker><ns0:pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><ns0:circle cx="1" cy="1" r=".7" fill="#C9DDD4" /></ns0:pattern></ns0:defs><ns0:style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif} .title{font-size:28px;font-weight:700;fill:#17334A}.sub{font-size:16px;fill:#6D8190}.label{font-size:17px;font-weight:700;fill:#17334A}.body{font-size:16px;fill:#4A6577}.small{font-size:13px;fill:#66828C}.mono{font-family:Consolas,monospace;font-size:15px;fill:#087E72}.edge{stroke:#168E82;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:6 5}.lane{stroke:#CBDDD7;stroke-width:1.2;stroke-dasharray:4 5}.light{fill:#F7FCFA;stroke:#BCDCD0}.white{fill:white;stroke:#D4E4DF}.navy{fill:#183F51;stroke:#183F51}.mint{fill:#E2F5EC;stroke:#A9D6C3}.violet{fill:#EEEFFC;stroke:#CECFF0}.gold{fill:#FFF5DE;stroke:#E8D3A1}.on{fill:white}.onsoft{fill:#BFE3D8}.badge{font-size:12px;font-weight:700;letter-spacing:1px;fill:#087E72}</ns0:style><ns0:rect width="1200" height="680" rx="24" fill="#F8FCFA" /><ns0:rect width="1200" height="680" rx="24" fill="url(#grid)" opacity=".45" /><ns0:text x="35" y="46" class="title">提问不是新开一堂课：它是一段可返回的中断</ns0:text><ns0:text x="35" y="77" class="sub">图 A · 提问前记住进度，回答后核对位置，再安排继续讲解</ns0:text><ns0:rect x="20" y="112" width="150" height="40" rx="10" class="navy" /><ns0:text x="95" y="138" class="label on" text-anchor="middle">学习者</ns0:text><ns0:path d="M95 160V615" class="lane" /><ns0:rect x="285" y="112" width="150" height="40" rx="10" class="navy" /><ns0:text x="360" y="138" class="label on" text-anchor="middle">课堂控制器</ns0:text><ns0:path d="M360 160V615" class="lane" /><ns0:rect x="575" y="112" width="150" height="40" rx="10" class="navy" /><ns0:text x="650" y="138" class="label on" text-anchor="middle">讲解播放</ns0:text><ns0:path d="M650 160V615" class="lane" /><ns0:rect x="935" y="112" width="150" height="40" rx="10" class="navy" /><ns0:text x="1010" y="138" class="label on" text-anchor="middle">问答输出</ns0:text><ns0:path d="M1010 160V615" class="lane" /><ns0:path d="M95 198H360" class="edge" /><ns0:text x="227.5" y="186" class="small" text-anchor="middle">提出当前页问题</ns0:text><ns0:path d="M360 245H650" class="edge" /><ns0:text x="505.0" y="233" class="small" text-anchor="middle">暂停当前课程播放</ns0:text><ns0:rect x="285" y="275" width="440" height="88" rx="13" class="mint" /><ns0:text x="307" y="305" class="label">记住当前课堂进度</ns0:text><ns0:text x="307" y="334" class="mono">所在页 · 动画步骤 · 完成情况 · 已讲内容</ns0:text><ns0:path d="M360 402H1010" class="edge" /><ns0:text x="685.0" y="390" class="small" text-anchor="middle">进入当前问题的回答过程</ns0:text><ns0:path d="M95 470H360" class="edge" /><ns0:text x="227.5" y="458" class="small" text-anchor="middle">点击“继续课程讲解”</ns0:text><ns0:path d="M360 520H1010" class="edge" /><ns0:text x="685.0" y="508" class="small" text-anchor="middle">终止问题输出并结束回答</ns0:text><ns0:path d="M360 580H650" class="edge" /><ns0:text x="505.0" y="568" class="small" text-anchor="middle">核对页面后，恢复或重新调度讲解</ns0:text><ns0:text x="42" y="649" class="small">恢复前核对页码、步骤与教学状态；是否复用已有播放位置取决于播放器状态。</ns0:text></ns0:svg>