" text-anchor="middle">已讲内容与完成情况</text><path d="M274 193H304V260H338" class="solid"/><path d="M274 340H304V260" class="solid"/><rect x="340" y="206" width="240" height="108" fill="white" stroke="#2A8E87" stroke-width="1.8"/><text x="460.0" y="242" class="node" text-anchor="middle">暂停课程播放</text><text x="460.0" y="271" class="detail" text-anchor="middle">先记住当前进度</text><rect x="625" y="206" width="240" height="108" fill="white" stroke="#2A8E87" stroke-width="1.8"/><text x="745.0" y="242" class="node" text-anchor="middle">围绕问题回答</text><text x="745.0" y="271" class="detail" text-anchor="middle">沿用当前页的内容</text><rect x="910" y="206" width="240" height="108" fill="white" stroke="#2A8E87" stroke-width="1.8"/><text x="1030.0" y="242" class="node" text-anchor="middle">结束问答输出</text><text x="1030.0" y="271" class="detail" text-anchor="middle">避免两段声音重叠</text><path d="M580 260H617" class="solid"/><path d="M865 260H902" class="solid"/><text x="744" y="371" class="note" text-anchor="middle">问答结束后再接续课程</text><rect x="350" y="513" width="265" height="108" fill="white" stroke="#2A8E87" stroke-width="1.8"/><text x="482.5" y="549" class="node" text-anchor="middle">核对当前课堂</text><text x="482.5" y="578" class="detail" text-anchor="middle">页面与步骤是否匹配</text><rect x="735" y="513" width="310" height="108" fill="white" stroke="#2A8E87" stroke-width="1.8"/><text x="890.0" y="549" class="node" text-anchor="middle">安排后续讲解</text><text x="890.0" y="578" class="detail" text-anchor="middle">恢复播放或重新调度</text><path d="M615 567H727" class="solid"/><path d="M1030 314V438H482V505" class="solid"/><path d="M890 513V458H159V408" class="feedback"/><path d="M24 646H1176" stroke="#D5E2E6"/><text x="24" y="671" class="note" text-anchor="start">核对页面、步骤与教学状态后继续；播放失效时重新安排，不保证逐字恢复。</text></svg>