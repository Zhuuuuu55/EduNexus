<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="提问不是新开一堂课：它是一段可返回的中断"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#168E82" stroke-width="1.8"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#C9DDD4"/></pattern></defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif} .title{font-size:28px;font-weight:700;fill:#17334A}.sub{font-size:16px;fill:#6D8190}.label{font-size:17px;font-weight:700;fill:#17334A}.body{font-size:16px;fill:#4A6577}.small{font-size:13px;fill:#66828C}.mono{font-family:Consolas,monospace;font-size:15px;fill:#087E72}.edge{stroke:#168E82;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:6 5}.lane{stroke:#CBDDD7;stroke-width:1.2;stroke-dasharray:4 5}.light{fill:#F7FCFA;stroke:#BCDCD0}.white{fill:white;stroke:#D4E4DF}.navy{fill:#183F51;stroke:#183F51}.mint{fill:#E2F5EC;stroke:#A9D6C3}.violet{fill:#EEEFFC;stroke:#CECFF0}.gold{fill:#FFF5DE;stroke:#E8D3A1}.on{fill:white}.onsoft{fill:#BFE3D8}.badge{font-size:12px;font-weight:700;letter-spacing:1px;fill:#087E72}</style><rect width="1200" height="680" rx="24" fill="#F8FCFA"/><rect width="1200" height="680" rx="24" fill="url(#grid)" opacity=".45"/><text x="35" y="46" class="title">提问不是新开一堂课：它是一段可返回的中断</text><text x="35" y="77" class="sub">FIG. A / EVENT SEQUENCE · 根据 holdLectureForQuestion、continueCourse 与 resumeAfterQuestion 整理</text><rect x="20" y="112" width="150" height="40" rx="10" class="navy"/><text x="95" y="138" class="label on" text-anchor="middle">学习者</text><path d="M95 160V615" class="lane"/><rect x="285" y="112" width="150" height="40" rx="10" class="navy"/><text x="360" y="138" class="label on" text-anchor="middle">课堂控制器</text><path d="M360 160V615" class="lane"/><rect x="575" y="112" width="150" height="40" rx="10" class="navy"/><text x="650" y="138" class="label on" text-anchor="middle">讲解播放</text><path d="M650 160V615" class="lane"/><rect x="935" y="112" width="150" height="40" rx="10" class="navy"/><text x="1010" y="138" class="label on" text-anchor="middle">问答输出</text><path d="M1010 160V615" class="lane"/><path d="M95 198H360" class="edge"/><text x="227.5" y="186" class="small" text-anchor="middle">提出当前页问题</text><path d="M360 245H650" class="edge"/><text x="505.0" y="233" class="small" text-anchor="middle">暂停课程播放 / suspend</text><rect x="285" y="275" width="440" height="88" rx="13" class="mint"/><text x="307" y="305" class="label">questionResume：保留恢复上下文</text><text x="307" y="334" class="mono">page · step · completed · previousResponse</text><path d="M360 402H1010" class="edge"/><text x="685.0" y="390" class="small" text-anchor="middle">进入当前问题的回答过程</text><path d="M95 470H360" class="edge"/><text x="227.5" y="458" class="small" text-anchor="middle">点击“继续课程讲解”</text><path d="M360 520H1010" class="edge"/><text x="685.0" y="508" class="small" text-anchor="middle">终止问题输出并结束回答</text><path d="M360 580H650" class="edge"/><text x="505.0" y="568" class="small" text-anchor="middle">核对页面后，恢复或重新调度讲解</text><text x="42" y="649" class="small">恢复前核对页码、步骤与教学状态；是否复用已有播放位置取决于播放器状态。</text></svg>