<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="先完成这一页，再进入下一页"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#168E82" stroke-width="1.8"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#C9DDD4"/></pattern></defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif} .title{font-size:28px;font-weight:700;fill:#17334A}.sub{font-size:16px;fill:#6D8190}.label{font-size:17px;font-weight:700;fill:#17334A}.body{font-size:16px;fill:#4A6577}.small{font-size:13px;fill:#66828C}.mono{font-family:Consolas,monospace;font-size:15px;fill:#087E72}.edge{stroke:#168E82;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:6 5}.lane{stroke:#CBDDD7;stroke-width:1.2;stroke-dasharray:4 5}.light{fill:#F7FCFA;stroke:#BCDCD0}.white{fill:white;stroke:#D4E4DF}.navy{fill:#183F51;stroke:#183F51}.mint{fill:#E2F5EC;stroke:#A9D6C3}.violet{fill:#EEEFFC;stroke:#CECFF0}.gold{fill:#FFF5DE;stroke:#E8D3A1}.on{fill:white}.onsoft{fill:#BFE3D8}.badge{font-size:12px;font-weight:700;letter-spacing:1px;fill:#087E72}</style><rect width="1200" height="680" rx="24" fill="#F8FCFA"/><rect width="1200" height="680" rx="24" fill="url(#grid)" opacity=".45"/><text x="35" y="46" class="title">先完成这一页，再进入下一页</text><text x="35" y="77" class="sub">FIG. B / STATE GATE · pageComplete、previewReady、buildMetadataPending 与 questionResume 共同控制推进</text><rect x="35" y="125" width="330" height="145" rx="13" class="navy"/><text x="55" y="157" class="label on">01 更新页面教学依据</text><text x="55" y="189" class="body onsoft">pageContext(artifactId)</text><text x="55" y="214" class="body onsoft">请求参数：page + scriptId</text><text x="55" y="239" class="body onsoft">响应包含当前页文本与讲稿</text><rect x="35" y="315" width="330" height="140" rx="13" class="white"/><text x="55" y="347" class="label">02 等待新画布就绪</text><text x="55" y="379" class="body">导航任务与画布 displayed 对齐</text><text x="55" y="404" class="body">暂停或导航更换时取消旧任务</text><text x="55" y="429" class="body">45 秒超时结束悬挂导航</text><path d="M200 277V307" class="edge"/><path d="M373 386H438" class="edge"/><path d="M585 270L725 385L585 500L445 385Z" class="mint"/><text x="585" y="365" class="label" text-anchor="middle">推进条件满足？</text><text x="585" y="394" class="small" text-anchor="middle">未暂停 · 当前页完成</text><text x="585" y="420" class="small" text-anchor="middle">画布就绪 · 无问答中断</text><rect x="820" y="138" width="330" height="135" rx="13" class="mint"/><text x="840" y="170" class="label">还有页内动画步骤</text><text x="840" y="202" class="body">buildStep &lt; stepCount − 1</text><text x="840" y="227" class="body">changeBuildStep(step + 1)</text><rect x="820" y="330" width="330" height="135" rx="13" class="white"/><text x="840" y="362" class="label">该页步骤已经结束</text><text x="840" y="394" class="body">存在下一页 → goToSlide</text><text x="840" y="419" class="body">到达课件末尾 → 结束教学</text><path d="M726 385H770V205H812" class="edge"/><path d="M770 385H812" class="edge"/><text x="750" y="188" class="small">是 / 先走步骤</text><text x="751" y="310" class="small">步骤完成后</text><path d="M585 502V560H200V463" class="edge dash"/><text x="430" y="585" class="small" text-anchor="middle">条件未满足：保持当前状态，等待就绪事件</text><text x="38" y="645" class="small">注意：页内分步与跨页导航是两种操作，不能把“画面出现”直接等同于“讲解完成”。</text></svg>