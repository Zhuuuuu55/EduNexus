<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="先完成这一页，再进入下一页"><ns0:defs><ns0:marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><ns0:path d="M1 1L8 4.5L1 8" fill="none" stroke="#168E82" stroke-width="1.8" /></ns0:marker><ns0:pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><ns0:circle cx="1" cy="1" r=".7" fill="#C9DDD4" /></ns0:pattern></ns0:defs><ns0:style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif} .title{font-size:28px;font-weight:700;fill:#17334A}.sub{font-size:16px;fill:#6D8190}.label{font-size:17px;font-weight:700;fill:#17334A}.body{font-size:16px;fill:#4A6577}.small{font-size:13px;fill:#66828C}.mono{font-family:Consolas,monospace;font-size:15px;fill:#087E72}.edge{stroke:#168E82;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:6 5}.lane{stroke:#CBDDD7;stroke-width:1.2;stroke-dasharray:4 5}.light{fill:#F7FCFA;stroke:#BCDCD0}.white{fill:white;stroke:#D4E4DF}.navy{fill:#183F51;stroke:#183F51}.mint{fill:#E2F5EC;stroke:#A9D6C3}.violet{fill:#EEEFFC;stroke:#CECFF0}.gold{fill:#FFF5DE;stroke:#E8D3A1}.on{fill:white}.onsoft{fill:#BFE3D8}.badge{font-size:12px;font-weight:700;letter-spacing:1px;fill:#087E72}</ns0:style><ns0:rect width="1200" height="680" rx="24" fill="#F8FCFA" /><ns0:rect width="1200" height="680" rx="24" fill="url(#grid)" opacity=".45" /><ns0:text x="35" y="46" class="title">先完成这一页，再进入下一页</ns0:text><ns0:text x="35" y="77" class="sub">图 B · 讲解完成、画面就绪且没有提问中断时，再推进教学</ns0:text><ns0:rect x="35" y="125" width="330" height="145" rx="13" class="navy" /><ns0:text x="55" y="157" class="label on">01 更新页面教学依据</ns0:text><ns0:text x="55" y="189" class="body onsoft">读取当前课件这一页的内容</ns0:text><ns0:text x="55" y="214" class="body onsoft">同时结合用户所选讲稿</ns0:text><ns0:text x="55" y="239" class="body onsoft">整理这一页的讲解依据</ns0:text><ns0:rect x="35" y="315" width="330" height="140" rx="13" class="white" /><ns0:text x="55" y="347" class="label">02 等待新画布就绪</ns0:text><ns0:text x="55" y="379" class="body">等待目标页面显示完成</ns0:text><ns0:text x="55" y="404" class="body">暂停或导航更换时取消旧任务</ns0:text><ns0:text x="55" y="429" class="body">准备超时后结束等待</ns0:text><ns0:path d="M200 277V307" class="edge" /><ns0:path d="M373 386H438" class="edge" /><ns0:path d="M585 270L725 385L585 500L445 385Z" class="mint" /><ns0:text x="585" y="365" class="label" text-anchor="middle">推进条件满足？</ns0:text><ns0:text x="585" y="394" class="small" text-anchor="middle">未暂停 · 当前页完成</ns0:text><ns0:text x="585" y="420" class="small" text-anchor="middle">画布就绪 · 无问答中断</ns0:text><ns0:rect x="820" y="138" width="330" height="135" rx="13" class="mint" /><ns0:text x="840" y="170" class="label">还有页内动画步骤</ns0:text><ns0:text x="840" y="202" class="body">当前页仍有未展示的步骤</ns0:text><ns0:text x="840" y="227" class="body">先展开下一步教学内容</ns0:text><ns0:rect x="820" y="330" width="330" height="135" rx="13" class="white" /><ns0:text x="840" y="362" class="label">该页步骤已经结束</ns0:text><ns0:text x="840" y="394" class="body">当前页完成 → 进入下一页</ns0:text><ns0:text x="840" y="419" class="body">到达课件末尾 → 结束教学</ns0:text><ns0:path d="M726 385H770V205H812" class="edge" /><ns0:path d="M770 385H812" class="edge" /><ns0:text x="750" y="188" class="small">是 / 先走步骤</ns0:text><ns0:text x="751" y="310" class="small">步骤完成后</ns0:text><ns0:path d="M585 502V560H200V463" class="edge dash" /><ns0:text x="430" y="585" class="small" text-anchor="middle">条件未满足：保持当前状态，等待就绪事件</ns0:text><ns0:text x="38" y="645" class="small">注意：页内分步与跨页导航是两种操作，不能把“画面出现”直接等同于“讲解完成”。</ns0:text></ns0:svg>