<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="可操作的 Demo，有明确的运行边界"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#168E82" stroke-width="1.8"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#C9DDD4"/></pattern></defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif} .title{font-size:28px;font-weight:700;fill:#17334A}.sub{font-size:16px;fill:#6D8190}.label{font-size:17px;font-weight:700;fill:#17334A}.body{font-size:16px;fill:#4A6577}.small{font-size:13px;fill:#66828C}.mono{font-family:Consolas,monospace;font-size:15px;fill:#087E72}.edge{stroke:#168E82;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:6 5}.lane{stroke:#CBDDD7;stroke-width:1.2;stroke-dasharray:4 5}.light{fill:#F7FCFA;stroke:#BCDCD0}.white{fill:white;stroke:#D4E4DF}.navy{fill:#183F51;stroke:#183F51}.mint{fill:#E2F5EC;stroke:#A9D6C3}.violet{fill:#EEEFFC;stroke:#CECFF0}.gold{fill:#FFF5DE;stroke:#E8D3A1}.on{fill:white}.onsoft{fill:#BFE3D8}.badge{font-size:12px;font-weight:700;letter-spacing:1px;fill:#087E72}</style><rect width="1200" height="680" rx="24" fill="#F8FCFA"/><rect width="1200" height="680" rx="24" fill="url(#grid)" opacity=".45"/><text x="35" y="46" class="title">可操作的 Demo，有明确的运行边界</text><text x="35" y="77" class="sub">FIG. C / TRUST BOUNDARY · 根据 ClassroomAssets.tsx 的 iframe sandbox 与 Content-Security-Policy 整理</text><rect x="30" y="115" width="1140" height="500" rx="20" class="white"/><text x="55" y="149" class="badge">课堂浏览器 / HOST APPLICATION</text><rect x="60" y="190" width="285" height="155" rx="13" class="mint"/><text x="80" y="222" class="label">教学资源入口</text><text x="80" y="254" class="body">AI 生成 / 用户导入</text><text x="80" y="279" class="body">HTML 内容或其他媒体</text><text x="80" y="304" class="body">资源与课堂材料关联</text><rect x="395" y="180" width="730" height="360" rx="20" class="light"/><text x="420" y="214" class="label">独立 iframe / opaque origin</text><rect x="430" y="245" width="315" height="145" rx="13" class="navy"/><text x="450" y="277" class="label on">允许：演示内部脚本</text><text x="450" y="309" class="body onsoft">sandbox=&quot;allow-scripts&quot;</text><text x="450" y="334" class="body onsoft">script-src / style-src</text><text x="450" y="359" class="body onsoft">仅内联脚本与样式</text><rect x="790" y="245" width="295" height="145" rx="13" class="gold"/><text x="810" y="277" class="label">限制：访问与外部行为</text><text x="810" y="309" class="body">connect-src：none</text><text x="810" y="334" class="body">form-action：none</text><text x="810" y="359" class="body">base-uri：none</text><path d="M352 267H422" class="edge"/><text x="420" y="434" class="mono">srcDoc 注入 CSP 与自适应样式；无 allow-same-origin</text><text x="420" y="478" class="small">图片来源限定 data: / blob:，字体限定 data:；原件保留下载或替换能力。</text><rect x="60" y="470" width="285" height="95" rx="13" class="violet"/><text x="80" y="505" class="label">图片 / 视频资源</text><text x="80" y="535" class="body">独立媒体渲染路径</text><text x="50" y="650" class="small">隔离是浏览器边界；生成内容仍需检查算法含义、交互输入及最终结果。</text></svg>