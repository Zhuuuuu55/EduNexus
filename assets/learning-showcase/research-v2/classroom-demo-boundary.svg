<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="可操作的 Demo，有明确的运行边界"><ns0:defs><ns0:marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><ns0:path d="M1 1L8 4.5L1 8" fill="none" stroke="#168E82" stroke-width="1.8" /></ns0:marker><ns0:pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><ns0:circle cx="1" cy="1" r=".7" fill="#C9DDD4" /></ns0:pattern></ns0:defs><ns0:style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif} .title{font-size:28px;font-weight:700;fill:#17334A}.sub{font-size:16px;fill:#6D8190}.label{font-size:17px;font-weight:700;fill:#17334A}.body{font-size:16px;fill:#4A6577}.small{font-size:13px;fill:#66828C}.mono{font-family:Consolas,monospace;font-size:15px;fill:#087E72}.edge{stroke:#168E82;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:6 5}.lane{stroke:#CBDDD7;stroke-width:1.2;stroke-dasharray:4 5}.light{fill:#F7FCFA;stroke:#BCDCD0}.white{fill:white;stroke:#D4E4DF}.navy{fill:#183F51;stroke:#183F51}.mint{fill:#E2F5EC;stroke:#A9D6C3}.violet{fill:#EEEFFC;stroke:#CECFF0}.gold{fill:#FFF5DE;stroke:#E8D3A1}.on{fill:white}.onsoft{fill:#BFE3D8}.badge{font-size:12px;font-weight:700;letter-spacing:1px;fill:#087E72}</ns0:style><ns0:rect width="1200" height="680" rx="24" fill="#F8FCFA" /><ns0:rect width="1200" height="680" rx="24" fill="url(#grid)" opacity=".45" /><ns0:text x="35" y="46" class="title">可操作的 Demo，有明确的运行边界</ns0:text><ns0:text x="35" y="77" class="sub">图 C · 用独立运行区域与访问限制，划清演示和课堂的边界</ns0:text><ns0:rect x="30" y="115" width="1140" height="500" rx="20" class="white" /><ns0:text x="55" y="149" class="badge">课堂页面 · 展示区域与演示区域相互独立</ns0:text><ns0:rect x="60" y="190" width="285" height="155" rx="13" class="mint" /><ns0:text x="80" y="222" class="label">教学资源入口</ns0:text><ns0:text x="80" y="254" class="body">AI 生成 / 用户导入</ns0:text><ns0:text x="80" y="279" class="body">可交互页面或其他媒体</ns0:text><ns0:text x="80" y="304" class="body">资源与课堂材料关联</ns0:text><ns0:rect x="395" y="180" width="730" height="360" rx="20" class="light" /><ns0:text x="420" y="214" class="label">独立演示区域 · 与课堂页面隔离</ns0:text><ns0:rect x="430" y="245" width="315" height="145" rx="13" class="navy" /><ns0:text x="450" y="277" class="label on">允许：演示内部交互</ns0:text><ns0:text x="450" y="309" class="body onsoft">允许演示自身响应交互</ns0:text><ns0:text x="450" y="334" class="body onsoft">样式与交互随演示一起提供</ns0:text><ns0:text x="450" y="359" class="body onsoft">主要使用自包含内容</ns0:text><ns0:rect x="790" y="245" width="295" height="145" rx="13" class="gold" /><ns0:text x="810" y="277" class="label">限制：外部访问与提交</ns0:text><ns0:text x="810" y="309" class="body">不开放任意外部网络连接</ns0:text><ns0:text x="810" y="334" class="body">不开放表单提交</ns0:text><ns0:text x="810" y="359" class="body">不允许改变资源定位基础</ns0:text><ns0:path d="M352 267H422" class="edge" /><ns0:text x="420" y="434" class="mono">演示可在内部操作，不授予直接控制外层课堂的权限</ns0:text><ns0:text x="420" y="478" class="small">图片与字体使用嵌入资源；依赖外部服务的演示需要适配。</ns0:text><ns0:rect x="60" y="470" width="285" height="95" rx="13" class="violet" /><ns0:text x="80" y="505" class="label">图片 / 视频资源</ns0:text><ns0:text x="80" y="535" class="body">独立媒体渲染路径</ns0:text><ns0:text x="50" y="650" class="small">隔离是浏览器边界；生成内容仍需检查算法含义、交互输入及最终结果。</ns0:text></ns0:svg>