<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="先确认能保存，再判断是否已经保存过"><ns0:defs><ns0:marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><ns0:path d="M1 1L8 4.5L1 8" fill="none" stroke="#168E82" stroke-width="1.8" /></ns0:marker><ns0:pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><ns0:circle cx="1" cy="1" r=".7" fill="#C9DDD4" /></ns0:pattern></ns0:defs><ns0:style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif} .title{font-size:28px;font-weight:700;fill:#17334A}.sub{font-size:16px;fill:#6D8190}.label{font-size:17px;font-weight:700;fill:#17334A}.body{font-size:16px;fill:#4A6577}.small{font-size:13px;fill:#66828C}.mono{font-family:Consolas,monospace;font-size:15px;fill:#087E72}.edge{stroke:#168E82;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:6 5}.lane{stroke:#CBDDD7;stroke-width:1.2;stroke-dasharray:4 5}.light{fill:#F7FCFA;stroke:#BCDCD0}.white{fill:white;stroke:#D4E4DF}.navy{fill:#183F51;stroke:#183F51}.mint{fill:#E2F5EC;stroke:#A9D6C3}.violet{fill:#EEEFFC;stroke:#CECFF0}.gold{fill:#FFF5DE;stroke:#E8D3A1}.on{fill:white}.onsoft{fill:#BFE3D8}.badge{font-size:12px;font-weight:700;letter-spacing:1px;fill:#087E72}</ns0:style><ns0:rect width="1200" height="680" rx="24" fill="#F8FCFA" /><ns0:rect width="1200" height="680" rx="24" fill="url(#grid)" opacity=".45" /><ns0:text x="35" y="46" class="title">先确认能保存，再判断是否已经保存过</ns0:text><ns0:text x="35" y="77" class="sub">图 F · 核对目标、检查来源、处理已有记录，再写入并确认结果</ns0:text><ns0:rect x="45" y="125" width="730" height="87" rx="13" class="white" /><ns0:rect x="61" y="143" width="47" height="47" rx="10" class="mint" /><ns0:text x="84" y="174" class="label" text-anchor="middle">01</ns0:text><ns0:text x="132" y="158" class="label">访问目标笔记本</ns0:text><ns0:text x="132" y="187" class="mono">确认当前用户可访问这个笔记本</ns0:text><ns0:path d="M408 216V230" class="edge" /><ns0:rect x="45" y="237" width="730" height="87" rx="13" class="white" /><ns0:rect x="61" y="255" width="47" height="47" rx="10" class="mint" /><ns0:text x="84" y="286" class="label" text-anchor="middle">02</ns0:text><ns0:text x="132" y="270" class="label">检查课程与来源范围</ns0:text><ns0:text x="132" y="299" class="mono">确认内容与目标课程的范围一致</ns0:text><ns0:path d="M408 328V342" class="edge" /><ns0:rect x="45" y="349" width="730" height="87" rx="13" class="white" /><ns0:rect x="61" y="367" width="47" height="47" rx="10" class="mint" /><ns0:text x="84" y="398" class="label" text-anchor="middle">03</ns0:text><ns0:text x="132" y="382" class="label">核对来源产物与权限</ns0:text><ns0:text x="132" y="411" class="mono">确认原内容存在，且允许当前用户保存</ns0:text><ns0:path d="M408 440V454" class="edge" /><ns0:rect x="45" y="461" width="730" height="87" rx="13" class="white" /><ns0:rect x="61" y="479" width="47" height="47" rx="10" class="mint" /><ns0:text x="84" y="510" class="label" text-anchor="middle">04</ns0:text><ns0:text x="132" y="494" class="label">检查同本重复来源</ns0:text><ns0:text x="132" y="523" class="mono">查找当前笔记本中有效的同来源记录</ns0:text><ns0:rect x="855" y="140" width="300" height="120" rx="13" class="gold" /><ns0:text x="875" y="172" class="label">权限 / 来源失败</ns0:text><ns0:text x="875" y="204" class="body">无权限 → 拒绝保存</ns0:text><ns0:text x="875" y="229" class="body">来源缺失 → 提示无法保存</ns0:text><ns0:path d="M780 280H818V202H847" class="edge dash" /><ns0:rect x="855" y="330" width="300" height="120" rx="13" class="violet" /><ns0:text x="875" y="362" class="label">已经归档过该产物</ns0:text><ns0:text x="875" y="394" class="body">查找现有记录</ns0:text><ns0:text x="875" y="419" class="body">按类型补齐课堂来源</ns0:text><ns0:path d="M780 503H818V391H847" class="edge" /><ns0:rect x="45" y="592" width="730" height="55" rx="13" class="navy" /><ns0:text x="410" y="627" class="label on" text-anchor="middle">写入或更新 → 返回结果 → 重新读取验证</ns0:text><ns0:path d="M408 552V584" class="edge" /><ns0:text x="857" y="505" class="small">重复检查针对带来源的产物，</ns0:text><ns0:text x="857" y="530" class="small">不按正文相似度合并手写内容。</ns0:text></ns0:svg>