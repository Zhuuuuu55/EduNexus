<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="笔记保存的不只是正文，还有归属与来源"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#168E82" stroke-width="1.8"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#C9DDD4"/></pattern></defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif} .title{font-size:28px;font-weight:700;fill:#17334A}.sub{font-size:16px;fill:#6D8190}.label{font-size:17px;font-weight:700;fill:#17334A}.body{font-size:16px;fill:#4A6577}.small{font-size:13px;fill:#66828C}.mono{font-family:Consolas,monospace;font-size:15px;fill:#087E72}.edge{stroke:#168E82;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:6 5}.lane{stroke:#CBDDD7;stroke-width:1.2;stroke-dasharray:4 5}.light{fill:#F7FCFA;stroke:#BCDCD0}.white{fill:white;stroke:#D4E4DF}.navy{fill:#183F51;stroke:#183F51}.mint{fill:#E2F5EC;stroke:#A9D6C3}.violet{fill:#EEEFFC;stroke:#CECFF0}.gold{fill:#FFF5DE;stroke:#E8D3A1}.on{fill:white}.onsoft{fill:#BFE3D8}.badge{font-size:12px;font-weight:700;letter-spacing:1px;fill:#087E72}</style><rect width="1200" height="680" rx="24" fill="#F8FCFA"/><rect width="1200" height="680" rx="24" fill="url(#grid)" opacity=".45"/><text x="35" y="46" class="title">笔记保存的不只是正文，还有归属与来源</text><text x="35" y="77" class="sub">FIG. E / RECORD ANATOMY · 三种入口共享记录模型；sourceMap 与来源字段按实际内容保留</text><rect x="30" y="135" width="270" height="112" rx="13" class="mint"/><text x="50" y="167" class="label">手写记录</text><text x="50" y="199" class="body">title + body</text><text x="50" y="224" class="body">学习者主动编辑</text><rect x="30" y="297" width="270" height="112" rx="13" class="mint"/><text x="50" y="329" class="label">课堂记录</text><text x="50" y="361" class="body">课堂整理与归档</text><text x="50" y="386" class="body">保留学习内容</text><rect x="30" y="459" width="270" height="112" rx="13" class="violet"/><text x="50" y="491" class="label">对话 / 产物保存</text><text x="50" y="523" class="body">artifactId + citations</text><text x="50" y="548" class="body">当前独立演示素材待补</text><rect x="420" y="130" width="400" height="455" rx="20" class="navy"/><text x="447" y="171" class="label on">NotebookNote</text><text x="447" y="204" class="small onsoft">可继续使用的一条记录</text><text x="447" y="246" class="mono onsoft">notebookId</text><text x="645" y="246" class="body on">归属的笔记本</text><text x="447" y="297" class="mono onsoft">artifactId?</text><text x="645" y="297" class="body on">可选的来源产物</text><text x="447" y="348" class="mono onsoft">title / body</text><text x="645" y="348" class="body on">可编辑内容</text><text x="447" y="399" class="mono onsoft">noteType</text><text x="645" y="399" class="body on">记录类型</text><text x="447" y="450" class="mono onsoft">sourceMap / refs</text><text x="645" y="450" class="body on">引用与来源线索</text><text x="447" y="501" class="mono onsoft">updatedAt</text><text x="645" y="501" class="body on">最近更新时间</text><path d="M307 190H412" class="edge"/><path d="M307 352H412" class="edge"/><path d="M307 514H412" class="edge"/><rect x="895" y="167" width="270" height="145" rx="13" class="white"/><text x="915" y="199" class="label">笔记本空间</text><text x="915" y="231" class="body">最近笔记 / 主题书架</text><text x="915" y="256" class="body">按条目选择内容</text><text x="915" y="281" class="body">进入编辑与整理</text><rect x="895" y="410" width="270" height="145" rx="13" class="mint"/><text x="915" y="442" class="label">后续学习</text><text x="915" y="474" class="body">回看来源与正文</text><text x="915" y="499" class="body">补充自己的理解</text><text x="915" y="524" class="body">更新后再次使用</text><path d="M827 292H887" class="edge"/><path d="M1030 320V402" class="edge"/><text x="38" y="648" class="small">有来源产物时才使用来源字段；手写笔记不强制伪造引用。</text></svg>