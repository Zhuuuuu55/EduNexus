<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="笔记保存的不只是正文，还有归属与来源"><ns0:defs><ns0:marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><ns0:path d="M1 1L8 4.5L1 8" fill="none" stroke="#168E82" stroke-width="1.8" /></ns0:marker><ns0:pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><ns0:circle cx="1" cy="1" r=".7" fill="#C9DDD4" /></ns0:pattern></ns0:defs><ns0:style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif} .title{font-size:28px;font-weight:700;fill:#17334A}.sub{font-size:16px;fill:#6D8190}.label{font-size:17px;font-weight:700;fill:#17334A}.body{font-size:16px;fill:#4A6577}.small{font-size:13px;fill:#66828C}.mono{font-family:Consolas,monospace;font-size:15px;fill:#087E72}.edge{stroke:#168E82;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:6 5}.lane{stroke:#CBDDD7;stroke-width:1.2;stroke-dasharray:4 5}.light{fill:#F7FCFA;stroke:#BCDCD0}.white{fill:white;stroke:#D4E4DF}.navy{fill:#183F51;stroke:#183F51}.mint{fill:#E2F5EC;stroke:#A9D6C3}.violet{fill:#EEEFFC;stroke:#CECFF0}.gold{fill:#FFF5DE;stroke:#E8D3A1}.on{fill:white}.onsoft{fill:#BFE3D8}.badge{font-size:12px;font-weight:700;letter-spacing:1px;fill:#087E72}</ns0:style><ns0:rect width="1200" height="680" rx="24" fill="#F8FCFA" /><ns0:rect width="1200" height="680" rx="24" fill="url(#grid)" opacity=".45" /><ns0:text x="35" y="46" class="title">笔记保存的不只是正文，还有归属与来源</ns0:text><ns0:text x="35" y="77" class="sub">图 E · 不同记录入口汇入笔记本，内容和来源一起整理</ns0:text><ns0:rect x="30" y="135" width="270" height="112" rx="13" class="mint" /><ns0:text x="50" y="167" class="label">手写记录</ns0:text><ns0:text x="50" y="199" class="body">自己编写标题和正文</ns0:text><ns0:text x="50" y="224" class="body">学习者主动编辑</ns0:text><ns0:rect x="30" y="297" width="270" height="112" rx="13" class="mint" /><ns0:text x="50" y="329" class="label">课堂记录</ns0:text><ns0:text x="50" y="361" class="body">课堂整理与归档</ns0:text><ns0:text x="50" y="386" class="body">保留学习内容</ns0:text><ns0:rect x="30" y="459" width="270" height="112" rx="13" class="violet" /><ns0:text x="50" y="491" class="label">对话 / 产物保存</ns0:text><ns0:text x="50" y="523" class="body">关联原始内容与来源</ns0:text><ns0:text x="50" y="548" class="body">当前独立演示素材待补</ns0:text><ns0:rect x="420" y="130" width="400" height="455" rx="20" class="navy" /><ns0:text x="447" y="171" class="label on">一条学习笔记</ns0:text><ns0:text x="447" y="204" class="small onsoft">可继续使用的一条记录</ns0:text><ns0:text x="447" y="246" class="mono onsoft">笔记本归属</ns0:text><ns0:text x="645" y="246" class="body on">按课程或主题整理</ns0:text><ns0:text x="447" y="297" class="mono onsoft">来源材料（可选）</ns0:text><ns0:text x="645" y="297" class="body on">便于回看原内容</ns0:text><ns0:text x="447" y="348" class="mono onsoft">标题与正文</ns0:text><ns0:text x="645" y="348" class="body on">支持后续编辑</ns0:text><ns0:text x="447" y="399" class="mono onsoft">记录的类型</ns0:text><ns0:text x="645" y="399" class="body on">区分整理场景</ns0:text><ns0:text x="447" y="450" class="mono onsoft">引用与来源</ns0:text><ns0:text x="645" y="450" class="body on">保留关联线索</ns0:text><ns0:text x="447" y="501" class="mono onsoft">最近更新时间</ns0:text><ns0:text x="645" y="501" class="body on">方便继续查阅</ns0:text><ns0:path d="M307 190H412" class="edge" /><ns0:path d="M307 352H412" class="edge" /><ns0:path d="M307 514H412" class="edge" /><ns0:rect x="895" y="167" width="270" height="145" rx="13" class="white" /><ns0:text x="915" y="199" class="label">笔记本空间</ns0:text><ns0:text x="915" y="231" class="body">最近笔记 / 主题书架</ns0:text><ns0:text x="915" y="256" class="body">按条目选择内容</ns0:text><ns0:text x="915" y="281" class="body">进入编辑与整理</ns0:text><ns0:rect x="895" y="410" width="270" height="145" rx="13" class="mint" /><ns0:text x="915" y="442" class="label">后续学习</ns0:text><ns0:text x="915" y="474" class="body">回看来源与正文</ns0:text><ns0:text x="915" y="499" class="body">补充自己的理解</ns0:text><ns0:text x="915" y="524" class="body">更新后再次使用</ns0:text><ns0:path d="M827 292H887" class="edge" /><ns0:path d="M1030 320V402" class="edge" /><ns0:text x="38" y="648" class="small">有来源产物时才使用来源字段；手写笔记不强制伪造引用。</ns0:text></ns0:svg>