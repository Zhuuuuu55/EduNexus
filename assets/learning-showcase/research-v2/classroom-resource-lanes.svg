<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="同一份教学资源，沿不同角色流转"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#168E82" stroke-width="1.8"/></marker><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#C9DDD4"/></pattern></defs><style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif} .title{font-size:28px;font-weight:700;fill:#17334A}.sub{font-size:16px;fill:#6D8190}.label{font-size:17px;font-weight:700;fill:#17334A}.body{font-size:16px;fill:#4A6577}.small{font-size:13px;fill:#66828C}.mono{font-family:Consolas,monospace;font-size:15px;fill:#087E72}.edge{stroke:#168E82;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:6 5}.lane{stroke:#CBDDD7;stroke-width:1.2;stroke-dasharray:4 5}.light{fill:#F7FCFA;stroke:#BCDCD0}.white{fill:white;stroke:#D4E4DF}.navy{fill:#183F51;stroke:#183F51}.mint{fill:#E2F5EC;stroke:#A9D6C3}.violet{fill:#EEEFFC;stroke:#CECFF0}.gold{fill:#FFF5DE;stroke:#E8D3A1}.on{fill:white}.onsoft{fill:#BFE3D8}.badge{font-size:12px;font-weight:700;letter-spacing:1px;fill:#087E72}</style><rect width="1200" height="680" rx="24" fill="#F8FCFA"/><rect width="1200" height="680" rx="24" fill="url(#grid)" opacity=".45"/><text x="35" y="46" class="title">同一份教学资源，沿不同角色流转</text><text x="35" y="77" class="sub">FIG. D / RESOURCE OWNERSHIP · 课程、课件、讲稿和 Demo 的关联与角色分工</text><rect x="30" y="120" width="1140" height="130" rx="16" class="mint"/><text x="52" y="155" class="badge">教师 / 课程授权维护者</text><rect x="30" y="280" width="1140" height="130" rx="16" class="white"/><text x="52" y="315" class="badge">课程与课件资源</text><rect x="30" y="475" width="1140" height="130" rx="16" class="violet"/><text x="52" y="510" class="badge">学生 / 学习使用者</text><rect x="245" y="164" width="230" height="55" rx="13" class="white"/><text x="360" y="199" class="label" text-anchor="middle">创建课程</text><rect x="545" y="164" width="230" height="55" rx="13" class="white"/><text x="660" y="199" class="label" text-anchor="middle">上传与维护课件</text><rect x="885" y="164" width="230" height="55" rx="13" class="white"/><text x="1000" y="199" class="label" text-anchor="middle">维护讲稿 / Demo</text><path d="M360 226V316" class="edge"/><path d="M660 226V316" class="edge"/><path d="M1000 226V316" class="edge"/><rect x="245" y="323" width="870" height="56" rx="13" class="navy"/><text x="680" y="357" class="mono onsoft" text-anchor="middle">course → courseware → script / demo / classroom context</text><rect x="245" y="520" width="230" height="55" rx="13" class="white"/><text x="360" y="555" class="label" text-anchor="middle">接收与查看</text><path d="M360 385V512" class="edge"/><rect x="545" y="520" width="230" height="55" rx="13" class="white"/><text x="660" y="555" class="label" text-anchor="middle">下载原始材料</text><path d="M660 385V512" class="edge"/><rect x="885" y="520" width="230" height="55" rx="13" class="white"/><text x="1000" y="555" class="label" text-anchor="middle">进入课堂使用</text><path d="M1000 385V512" class="edge"/><text x="53" y="436" class="small">资源归属与角色权限决定可见的操作入口；发布与接收分别验证。</text><text x="53" y="649" class="small">图示为资源关联机制；飞书新增权限与 Demo 发布素材按用户要求保留原文入口。</text></svg>