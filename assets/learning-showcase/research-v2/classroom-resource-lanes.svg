<ns0:svg xmlns:ns0="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="同一份教学资源，沿不同角色流转"><ns0:defs><ns0:marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><ns0:path d="M1 1L8 4.5L1 8" fill="none" stroke="#168E82" stroke-width="1.8" /></ns0:marker><ns0:pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><ns0:circle cx="1" cy="1" r=".7" fill="#C9DDD4" /></ns0:pattern></ns0:defs><ns0:style>text{font-family:"Microsoft YaHei","Noto Sans SC",sans-serif} .title{font-size:28px;font-weight:700;fill:#17334A}.sub{font-size:16px;fill:#6D8190}.label{font-size:17px;font-weight:700;fill:#17334A}.body{font-size:16px;fill:#4A6577}.small{font-size:13px;fill:#66828C}.mono{font-family:Consolas,monospace;font-size:15px;fill:#087E72}.edge{stroke:#168E82;stroke-width:2;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:6 5}.lane{stroke:#CBDDD7;stroke-width:1.2;stroke-dasharray:4 5}.light{fill:#F7FCFA;stroke:#BCDCD0}.white{fill:white;stroke:#D4E4DF}.navy{fill:#183F51;stroke:#183F51}.mint{fill:#E2F5EC;stroke:#A9D6C3}.violet{fill:#EEEFFC;stroke:#CECFF0}.gold{fill:#FFF5DE;stroke:#E8D3A1}.on{fill:white}.onsoft{fill:#BFE3D8}.badge{font-size:12px;font-weight:700;letter-spacing:1px;fill:#087E72}</ns0:style><ns0:rect width="1200" height="680" rx="24" fill="#F8FCFA" /><ns0:rect width="1200" height="680" rx="24" fill="url(#grid)" opacity=".45" /><ns0:text x="35" y="46" class="title">同一份教学资源，沿不同角色流转</ns0:text><ns0:text x="35" y="77" class="sub">图 D · 围绕同一份课件，组织教学资源与师生操作</ns0:text><ns0:rect x="30" y="120" width="1140" height="130" rx="16" class="mint" /><ns0:text x="52" y="155" class="badge">教师 / 课程授权维护者</ns0:text><ns0:rect x="30" y="280" width="1140" height="130" rx="16" class="white" /><ns0:text x="52" y="315" class="badge">课程与课件资源</ns0:text><ns0:rect x="30" y="475" width="1140" height="130" rx="16" class="violet" /><ns0:text x="52" y="510" class="badge">学生 / 学习使用者</ns0:text><ns0:rect x="245" y="164" width="230" height="55" rx="13" class="white" /><ns0:text x="360" y="199" class="label" text-anchor="middle">创建课程</ns0:text><ns0:rect x="545" y="164" width="230" height="55" rx="13" class="white" /><ns0:text x="660" y="199" class="label" text-anchor="middle">上传与维护课件</ns0:text><ns0:rect x="885" y="164" width="230" height="55" rx="13" class="white" /><ns0:text x="1000" y="199" class="label" text-anchor="middle">维护讲稿 / Demo</ns0:text><ns0:path d="M360 226V316" class="edge" /><ns0:path d="M660 226V316" class="edge" /><ns0:path d="M1000 226V316" class="edge" /><ns0:rect x="245" y="323" width="870" height="56" rx="13" class="navy" /><ns0:text x="680" y="357" class="mono onsoft" text-anchor="middle">课程 → 课件 → 配套讲稿与演示 → 课堂学习</ns0:text><ns0:rect x="245" y="520" width="230" height="55" rx="13" class="white" /><ns0:text x="360" y="555" class="label" text-anchor="middle">接收与查看</ns0:text><ns0:path d="M360 385V512" class="edge" /><ns0:rect x="545" y="520" width="230" height="55" rx="13" class="white" /><ns0:text x="660" y="555" class="label" text-anchor="middle">下载原始材料</ns0:text><ns0:path d="M660 385V512" class="edge" /><ns0:rect x="885" y="520" width="230" height="55" rx="13" class="white" /><ns0:text x="1000" y="555" class="label" text-anchor="middle">进入课堂使用</ns0:text><ns0:path d="M1000 385V512" class="edge" /><ns0:text x="53" y="436" class="small">资源归属与角色权限决定可见的操作入口；发布与接收分别验证。</ns0:text><ns0:text x="53" y="649" class="small">原始材料、讲稿和演示分别管理，使用时围绕当前课件衔接。</ns0:text></ns0:svg>